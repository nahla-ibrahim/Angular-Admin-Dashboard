<div class="bg-gray-200 h-full min-h-screen py-3 dark:bg-dark">
  <div class="container mx-auto px-3 my-12">
    <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4 mb-6">
      <input
        type="text"
        (input)="search()"
        [(ngModel)]="searchInput"
        placeholder="search..."
        class="border p-2 mb-0 sm:mb-4 focus:ring-1 focus:ring-primary outline-none border-gray-400 placeholder:text-gray-500 w-full sm:w-1/2 rounded-lg dark:text-gray-400"
      />

      <button
        class="bg-primary py-2 rounded-lg mb-4 cursor-pointer hover:text-gray-300 px-3 dark:bg-linear-to-b from-primary/80 to-black dark:text-gray-300 dark:hover:text-gray-200 dark:border dark:border-gray-700"
        (click)="add()"
      >
        Add New product
      </button>
    </div>

    <app-table [headers]="headers" (sort)="getAllProducts($event)">
      @for (item of data(); track $index) {
        <tr
          class="border-b bg-gray-100 hover:bg-gray-200 transition border-gray-400 [&>td]:py-4 [&>td]:px-5 [&>td]:text-sm [&>td]:text-gray-700 even:bg-gray-50 [&>td]:border-r-gray-400 [&>td]:border-r [&>td]:last:border-0 text-center dark:bg-primary-dark dark:text-white dark:border-gray-300 dark:even:bg-primary-dark/90 dark:hover:bg-primary-dark/70 dark:[&>td]:border-gray-300 dark:[&>td]:text-gray-300"
        >
          <td>{{ item.id }}</td>
          <td>{{ item.title }}</td>
          <td>{{ item.price }}</td>
          <td>{{ item.category }}</td>
          <td>{{ item.rating }}</td>
          <td>{{ item.stock }}</td>
          <td>{{ item.brand }}</td>
          <td class="flex items-center gap-5 cursor-pointer justify-evenly">
            <button
              class="cursor-pointer text-primary hover:text-primary-dark"
              (click)="thisProduct.set(item); isUpdateModalOpen.set(true)"
            >
              <fa-icon [icon]="pen"></fa-icon>
            </button>
            <button
              class="cursor-pointer text-red-500 hover:text-red-800"
              (click)="deleteProduct(item)"
            >
              <fa-icon [icon]="Trash"></fa-icon>
            </button>
          </td>
        </tr>
      }
    </app-table>

    <!-- /////// pagination ////////// -->
    <div class="flex justify-around items-center mt-4">
      <button
        (click)="prevPage()"
        [disabled]="page === 1"
        class="px-5 py-2 bg-gray-400 rounded-lg disabled:opacity-50 disabled:hover:bg-gray-400 disabled:cursor-no-drop cursor-pointer hover:bg-gray-600 transition hover:text-gray-300"
      >
        prev
      </button>
      <span class="dark:text-gray-300"> page {{ page }} </span>
      <button
        (click)="nextPage()"
        [disabled]="limit * page >= total"
        class="px-5 py-2 bg-gray-400 rounded-lg disabled:opacity-50 disabled:hover:bg-gray-400 cursor-pointer hover:bg-gray-600 hover:text-gray-300"
      >
        next
      </button>
    </div>

    <!-- ///////////// Add new user modal ///////////// -->
    @if (isModalOpen()) {
      <app-form (close)="isModalOpen.set(false)" formTitle="Add New User"></app-form>
    }
    @if (isUpdateModalOpen()) {
      <app-form
        (close)="isUpdateModalOpen.set(false)"
        formTitle="Edit User"
        [theProduct]="thisProduct()"
      ></app-form>
    }
  </div>
</div>

@if (delete()) {
  <app-alert-modal text="Are you sure you want to delete this product?">
    <div class="flex justify-end gap-4 mt-6">
      <button
        class="px-5 py-2 rounded-lg bg-gray-400 hover:bg-gray-600 hover:text-gray-300 transition cursor-pointer"
        (click)="delete.set(false)"
      >
        Cancel
      </button>
      <button
        class="px-5 py-2 rounded-lg bg-red-500 hover:bg-red-700 hover:text-gray-300 transition cursor-pointer"
        (click)="confirmDelete()"
      >
        Delete
      </button>
    </div>
  </app-alert-modal>
}
