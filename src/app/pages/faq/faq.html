<div class="bg-gray-200 h-full min-h-screen py-3 dark:bg-dark">
  <div class="container mx-auto px-3 my-12 max-w-4xl">
    <div class="text-center mb-10">
      <h1 class="text-4xl font-bold text-gray-800 dark:text-white mb-3">
        Frequently Asked Questions
      </h1>

      <p class="text-gray-500 dark:text-dark-400">
        Find answers to common questions about the dashboard.
      </p>
    </div>

    <div class="space-y-4">
      @for (faq of faqs(); track $index) {
        <div
          class="bg-white rounded-2xl shadow-sm border border-gray-200 dark:bg-transparent dark:bg-linear-to-b dark:from-primary/50 dark:to-black dark:text-gray-300 dark:border dark:border-gray-700 overflow-hidden transition-all duration-300"
        >
          <button
            (click)="toggleFAQ($index)"
            class="w-full flex items-center justify-between p-5 text-left cursor-pointer"
          >
            <span class="font-medium text-gray-800 dark:text-white">
              {{ faq.question }}
            </span>

            <fa-icon
              [icon]="chevron"
              class="transition-transform duration-300 text-primary"
              [class.rotate-180]="faq.isOpen"
            >
            </fa-icon>
          </button>

          @if (faq.isOpen) {
            <div class="px-5 pb-5 text-gray-600 dark:text-gray-300 leading-7">
              {{ faq.answer }}
            </div>
          }
        </div>
      }
    </div>
  </div>
</div>
