<div class="bg-gray-200 h-full min-h-screen py-3 dark:bg-black">
  <div class="container mx-auto px-3 my-12">
    <app-table [headers]="headers" (sort)="getAllOrders($event)">
      @for (item of data(); track $index) {
        <tr
          class="border-b bg-gray-100 hover:bg-gray-200 transition border-gray-400 [&>td]:py-4 [&>td]:px-5 [&>td]:text-sm [&>td]:text-gray-700 [&>td]:border-r-gray-400 [&>td]:border-r [&>td]:last:border-0 text-center dark:bg-primary-dark dark:text-white dark:border-gray-300 dark:even:bg-primary-dark/90 dark:hover:bg-primary-dark/80 dark:[&>td]:border-gray-300 dark:[&>td]:text-gray-300"
        >
          <td>{{ item.userId }}</td>
          <td class="flex flex-col p-0!">
            @for (product of item.products; track $index) {
              <div class="flex justify-between border-b border-gray-300 p-3 last:border-0">
                <td>{{ product.title }}</td>
                <td>{{ product.quantity }}</td>
              </div>
            }
          </td>
          <td>{{ item.totalProducts }}</td>
          <td>{{ item.totalQuantity }}</td>
          <td>{{ item.total }}</td>
          <td>
            <fa-icon
              [icon]="Trash"
              class="flex items-center justify-center cursor-pointer text-red-500 hover:text-red-80 py-4 px-5 text-sm text-center w-full h-full m-auto"
              (click)="deleteOrders(item)"
            ></fa-icon>
          </td>
        </tr>
      }
    </app-table>

    <!-- /////// pagination ////////// -->
    <div class="flex justify-around items-center mt-4">
      <button
        (click)="prevPage()"
        [disabled]="page === 1"
        class="px-5 py-2 bg-gray-400 rounded-lg disabled:opacity-50 disabled:hover:bg-gray-400 disabled:cursor-no-drop cursor-pointer hover:bg-gray-600 transition hover:text-gray-300"
      >
        prev
      </button>
      <span class="dark:text-gray-300"> page {{ page }} </span>
      <button
        (click)="nextPage()"
        [disabled]="limit * page >= total"
        class="px-5 py-2 bg-gray-400 rounded-lg disabled:opacity-50 disabled:hover:bg-gray-400 cursor-pointer hover:bg-gray-600 hover:text-gray-300"
      >
        next
      </button>
    </div>
  </div>
</div>

@if (delete()) {
  <app-alert-modal text="Are you sure you want to delete this order?">
    <div class="flex justify-end gap-4 mt-6">
      <button
        class="px-5 py-2 rounded-lg bg-gray-400 hover:bg-gray-600 hover:text-gray-300 transition cursor-pointer"
        (click)="delete.set(false)"
      >
        Cancel
      </button>
      <button
        class="px-5 py-2 rounded-lg bg-red-500 hover:bg-red-700 hover:text-gray-300 transition cursor-pointer"
        (click)="confirmDelete()"
      >
        Delete
      </button>
    </div>
  </app-alert-modal>
}
